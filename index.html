<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rituali Benessere | VTV</title>
<style>
@font-face{font-family:Gotham;src:url('./Gotham-Bold.otf') format('opentype');font-style:normal;font-weight:700;font-display:swap}
:root{--red:#b00021;--ivory:#fff0e5;--cocoa:#54240f}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#2a1005;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
#stage{position:absolute;top:50%;left:50%;height:1080px;width:1920px;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center;overflow:hidden;background:#a94e18}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s;overflow:hidden}
.slide.active{opacity:1;visibility:visible;transition:opacity .4s,visibility 0s}
#marketing{width:100%;height:100%;object-fit:cover;display:block}
/* Fondali senza testi incorporati, separati dagli elementi dinamici. */
.wood-light,.wood-dark{position:absolute;inset:0;pointer-events:none}
.wood-light{background:linear-gradient(90deg,#d46b24dd,#b65619aa 75%),url('assets/legno-chiaro.jpg') center top / 1920px 220px repeat-y}
.wood-dark{background:radial-gradient(ellipse at 90% 50%,#a34e1c66,transparent 70%),linear-gradient(90deg,#47200bcf,#633012cc),url('assets/legno-scuro.jpg') center top / 1920px 220px repeat-y}
.wood-light:after,.wood-dark:after{content:'';position:absolute;right:0;bottom:0;width:47%;height:180px;background:repeating-linear-gradient(96deg,#9c4217 0 12px,#d47b33 13px 108px,#64270b 109px 118px);border-top:7px solid #7f310e;clip-path:polygon(8% 6%,100% 0%,100% 100%,0% 100%);opacity:.64}
.wood-dark:after{opacity:.35}
/* Comune */
.gotham{font-family:Gotham,Arial,sans-serif;font-weight:700}
.vline{position:absolute;left:694px;top:103px;height:768px;width:3px;background:#ffffffb5}
.brand{position:absolute;left:72px;bottom:51px;color:#fff;z-index:2;line-height:.75;display:flex;align-items:flex-end;gap:4px;text-shadow:0 2px 3px #63270944}
.brand .virgin{font:italic 76px Georgia,serif;letter-spacing:-6px;transform:rotate(-10deg) translateY(-14px);transform-origin:left bottom}
.brand .active{font:normal 57px Arial,Helvetica,sans-serif;letter-spacing:-5px}
/* Slide 2: programma */
.program-title{position:absolute;left:71px;top:91px;width:590px;color:white}
.program-title h1{margin:0;font:700 83px/.97 Gotham,Arial,sans-serif;letter-spacing:-2px}
.program-title p{font:normal 39px/1.12 Arial,sans-serif;margin:37px 0 0;text-transform:uppercase;letter-spacing:.3px}
.program-title .rule{height:4px;width:151px;background:white;margin-top:38px}
.date-card{position:absolute;top:495px;left:69px;width:600px;height:161px;border-radius:24px;background:linear-gradient(110deg,#a8001b,#c70024);display:flex;align-items:center;gap:28px;padding:21px 28px;color:#fff}
.date-card svg{flex:0 0 83px;width:83px;height:83px;stroke:#fff;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
#event-date{font:700 45px/1.04 Gotham,Arial,sans-serif;letter-spacing:-.8px;display:block;min-width:0;overflow-wrap:normal}
.book-card{position:absolute;top:698px;left:69px;width:600px;min-height:134px;border:3px solid #fff;border-radius:24px;background:rgba(95,37,12,.06);display:flex;align-items:center;gap:27px;padding:15px 28px;color:white}
.book-card svg{width:85px;height:85px;flex:0 0 85px;fill:none;stroke:#fff;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
#booking-info{font:700 32px/1.12 Gotham,Arial,sans-serif;overflow-wrap:break-word}
.table{position:absolute;left:725px;top:101px;width:1123px;height:754px;background:var(--ivory);border:3px solid #fff5e9;border-radius:29px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 35px #3d140b24}
.table-head{flex:0 0 69px;background:linear-gradient(90deg,#a5001b,#bd001c);color:#fff;display:grid;grid-template-columns:167px 77px minmax(0,1fr) 295px;align-items:center;padding:0 22px;font:700 34px Gotham,Arial}
.table-head span:first-child{grid-column:1}.table-head span:nth-child(2){grid-column:3}.table-head span:nth-child(3){grid-column:4;text-align:center}
.table-body{flex:1;min-height:0;display:flex;flex-direction:column}
.ritual-row{min-height:0;flex:1;display:grid;grid-template-columns:167px 77px minmax(0,1fr) 295px;padding:0 22px;align-items:center;border-bottom:2px solid white;color:#080808;background:#ffefe4}
.ritual-row:nth-child(even){background:#fae9dd}.ritual-row:last-child{border-bottom:0}
.r-time{font:700 34px Gotham,Arial;letter-spacing:-.7px}
.r-icon{display:flex;align-items:center;justify-content:center;width:57px;height:54px}
.r-icon svg{width:49px;height:49px;fill:none;stroke:#111;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.r-icon.hot svg{stroke:#b90025}
.r-name{font:700 27px/1.11 Gotham,Arial,sans-serif;letter-spacing:-.6px;padding-right:9px;overflow-wrap:break-word}
.r-label{justify-self:center;width:284px;min-height:48px;display:flex;justify-content:center;align-items:center;text-align:center;background:#f9e2c9;color:#21140d;border:2px solid #ac783c;border-radius:40px;font:700 25px/1.08 Gotham,Arial;padding:6px 8px}
.r-label.status{color:white;background:#33923b;border-color:#33923b;font-size:23px}.r-label.status.now{background:#b80020;border-color:#b80020}.r-label.status.done{background:#6a6867;border-color:#6a6867}
/* Slide 3: calendario - UN SOLO pannello. Nessuna fotografia con tabella pre-stampata. */
.calendar-left{position:absolute;left:139px;top:171px;width:539px;color:white;text-align:center}
.calendar-left h1{text-align:left;margin:0;font:700 78px/.98 Gotham,Arial;letter-spacing:-2px}
.calendar-left .line{height:3px;background:#ffffffd1;width:510px;margin:39px 0 54px}
.calendar-left h2{margin:0;font:700 57px/1.09 Gotham,Arial}
.cal-divider{left:707px;top:101px;height:826px}
.calendar-panel{position:absolute;left:750px;top:101px;width:1105px;height:825px;border:3px solid #f6d5ad;border-radius:50px;background:linear-gradient(100deg,#703415f2,#89431def);padding:19px 30px;display:flex;flex-direction:column;box-shadow:0 16px 32px #2e11071b}
.cal-row{height:20%;flex:1;display:grid;grid-template-columns:208px 1fr;align-items:center;gap:36px;padding:0 12px;border-bottom:1px solid #e1b78780;opacity:0;transform:translateY(-13px)}.cal-row:last-child{border-bottom:0}
.cal-row.play{animation:reveal .34s ease both}
.cal-tile{height:138px;width:207px;border-radius:30px;background:#f9dcb4;color:#221308;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.cal-row:first-child .cal-tile{background:#b00023;color:white;border:3px solid #fff0dd}
.cal-num{font:700 73px/.96 Gotham,Arial}.cal-month{font:700 34px Gotham,Arial;margin-top:5px}
.cal-weekday{font:700 60px/1.08 Gotham,Arial;color:#fff}.cal-full{font:normal 39px/1.13 Arial,sans-serif;color:#fff;margin-top:1px}
@keyframes reveal{from{opacity:0;transform:translateY(-13px)}to{opacity:1;transform:translateY(0)}}
.empty{display:flex;align-items:center;justify-content:center;height:100%;color:#3c2215;font:700 32px Gotham,Arial;text-align:center;padding:25px}
@media(prefers-reduced-motion:reduce){.slide{transition:none}.cal-row.play{animation:none;opacity:1;transform:none}}
</style>
</head>
<body><main id="stage" aria-label="Rituali Benessere - VTV">
<section class="slide active" id="slide-marketing"><img id="marketing" src="cartello.jpg" alt="Cartello marketing ufficiale"></section>
<section class="slide" id="slide-program">
  <div class="wood-light"></div><div class="vline"></div>
  <div class="program-title"><h1>RITUALI<br>BENESSERE</h1><p>UN VIAGGIO TRA VAPORE<br>E AROMI ESSENZIALI<br>CHE RIGENERANO I SENSI.</p><div class="rule"></div></div>
  <div class="date-card"><svg viewBox="0 0 80 80"><rect x="12" y="17" width="56" height="53" rx="7"/><path d="M12 33h56M27 7v20M53 7v20"/></svg><span id="event-date">PROSSIMO EVENTO</span></div>
  <div class="book-card"><svg viewBox="0 0 80 80"><circle cx="40" cy="20" r="12"/><path d="M13 69V55c0-13 12-21 27-21s27 8 27 21v14z"/></svg><span id="booking-info">PRENOTAZIONI IN RECEPTION</span></div>
  <div class="table"><div class="table-head"><span>ORARIO</span><span>RITUALE</span><span id="third-title">LOCATION</span></div><div class="table-body" id="program-rows"></div></div>
  <div class="brand"><span class="virgin">Virgin</span><span class="active">active</span></div>
</section>
<section class="slide" id="slide-calendar">
  <div class="wood-dark"></div><div class="vline cal-divider"></div>
  <div class="calendar-left"><h1>RITUALI<br>BENESSERE</h1><div class="line"></div><h2>PROSSIMI<br>APPUNTAMENTI</h2></div>
  <div class="calendar-panel" id="calendar-rows"></div>
  <div class="brand"><span class="virgin">Virgin</span><span class="active">active</span></div>
</section>
</main>
<script>
(()=>{'use strict';
const fallback=[['10:30','Scrub viso e corpo Frutti Rossi','Bagno Turco'],['11:30','Maschera viso','Infrared'],['12:30','Aufguss balsamico','Sauna'],['13:15','Maschera viso','Infrared'],['14:00','Maschera viso','Area esterna'],['15:45','Aufguss balsamico','Sauna'],['16:30','Maschera viso','Area esterna'],['17:15','Savonage con sapone nero marocchino','Bagno Turco'],['18:00','Maschera viso','Infrared'],['19:15','Aufguss balsamico','Sauna']].map((x,i)=>({id:'r'+i,time:x[0],name:x[1],area:x[2],duration:10}));
let data={events:[],standard:fallback};const demo=new URLSearchParams(location.search).has('demo');
if(demo)data.events=['2026-11-27','2026-12-04','2027-01-15','2027-02-12','2027-03-19'].map((date,i)=>({id:'demo'+i,date,program:fallback}));
const $=s=>document.querySelector(s);
function parseDate(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s));if(!m)return null;const d=new Date(+m[1],+m[2]-1,+m[3],12);return d.getFullYear()===+m[1]&&d.getMonth()===+m[2]-1&&d.getDate()===+m[3]?d:null}
function dateText(s,options){const d=parseDate(s);return d?d.toLocaleDateString('it-IT',options):''}
function romeParts(){const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Rome',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const v=x=>parts.find(p=>p.type===x)?.value;return{date:`${v('year')}-${v('month')}-${v('day')}`,minute:+v('hour')*60+(+v('minute'))}}
function getEvents(){const now=romeParts().date;return (data.events||[]).filter(e=>parseDate(e.date)&&e.date>=now).slice().sort((a,b)=>a.date.localeCompare(b.date))}
function startBooking(s){const d=parseDate(s);if(!d)return '';d.setDate(d.getDate()-7);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function icon(area){const a=String(area||'').toLowerCase();if(a.includes('turco'))return '<svg viewBox="0 0 60 60"><circle cx="19" cy="15" r="7"/><circle cx="42" cy="13" r="5"/><circle cx="22" cy="37" r="5"/><circle cx="43" cy="42" r="8"/></svg>';if(a.includes('infra'))return '<svg viewBox="0 0 60 60"><path d="M9 48C8 25 25 10 51 9c-1 26-14 42-40 41"/><path d="M11 51L44 17"/></svg>';if(a.includes('sauna'))return '<svg viewBox="0 0 60 60"><path d="M14 8C2 21 24 27 12 44M30 7C17 22 40 29 27 45M46 8C32 22 54 30 41 45"/><path d="M7 52Q30 60 54 52"/></svg>';return '<svg viewBox="0 0 60 60"><path d="M30 7v46M7 30h46M14 14l32 32M46 14L14 46"/></svg>'}
function status(r,minute){const x=/^(\d{1,2}):(\d{2})$/.exec(String(r.time||''));if(!x)return 'IN PROGRAMMA';const start=+x[1]*60+(+x[2]);const duration=Number(r.duration)||10;return minute<start?'IN PROGRAMMA':minute<start+duration?'IN CORSO':'CONCLUSO'}
function formatArea(a){const s=String(a||'');if(s.toLowerCase().includes('turco'))return 'Bagno Turco';if(s.toLowerCase().includes('infra'))return 'Infrared';if(s.toLowerCase()==='sauna')return 'Sauna';return s}
let lastProgramKey='';function renderProgram(force=false){const e=getEvents()[0];const now=romeParts();const key=JSON.stringify([e?.date,now.date,now.minute,e?.program||data.standard]);if(!force&&key===lastProgramKey)return;lastProgramKey=key;
if(!e){$('#event-date').textContent='PROSSIMO\nEVENTO';$('#booking-info').textContent='DATE IN\nAGGIORNAMENTO';$('#third-title').textContent='LOCATION';$('#program-rows').innerHTML='<div class="empty">Programma in aggiornamento</div>';return}
const d=parseDate(e.date);const dateString=`${dateText(e.date,{weekday:'long'}).toUpperCase()}\n${d.getDate()} ${dateText(e.date,{month:'long'}).toUpperCase()}\n${d.getFullYear()}`;$('#event-date').textContent=dateString;
const open=startBooking(e.date);$('#booking-info').textContent=now.date<open?'PRENOTAZIONI APERTE\nDAL '+dateText(open,{day:'numeric',month:'long'}).toUpperCase():'PRENOTAZIONI APERTE\nIN RECEPTION';
const today=now.date===e.date;$('#third-title').textContent=today?'STATO':'LOCATION';const rows=(Array.isArray(e.program)?e.program:data.standard||fallback).slice().sort((a,b)=>String(a.time).localeCompare(String(b.time)));
$('#program-rows').innerHTML=rows.length?rows.map(r=>{const st=today?status(r,now.minute):null;const cl=st==='IN CORSO'?'now':st==='CONCLUSO'?'done':'';const a=String(r.area||'');return `<div class="ritual-row"><span class="r-time">${esc(r.time||'')}</span><span class="r-icon ${a.toLowerCase()==='sauna'?'hot':''}">${icon(a)}</span><span class="r-name">${esc(r.name||'')}</span><span class="r-label ${today?'status '+cl:''}">${today?st:esc(formatArea(a))}</span></div>`}).join(''):'<div class="empty">Programma in aggiornamento</div>';
}
function renderCalendar(){const rows=getEvents().slice(0,5);$('#calendar-rows').innerHTML=rows.length?rows.map(e=>{const d=parseDate(e.date);return `<div class="cal-row"><div class="cal-tile"><span class="cal-num">${d.getDate()}</span><span class="cal-month">${esc(dateText(e.date,{month:'short'}).replace('.','').toUpperCase())}</span></div><div><div class="cal-weekday">${esc(dateText(e.date,{weekday:'long'}).toUpperCase())}</div><div class="cal-full">${esc(dateText(e.date,{day:'numeric',month:'long',year:'numeric'}))}</div></div></div>`}).join(''):'<div class="empty" style="color:white">Nuove date in aggiornamento</div>'}
const slides=[{el:$('#slide-marketing'),duration:10000},{el:$('#slide-program'),duration:15000},{el:$('#slide-calendar'),duration:10000}];let current=0,started=Date.now();function switchTo(n){current=n;slides.forEach((s,i)=>s.el.classList.toggle('active',i===n));if(n===1)renderProgram(true);if(n===2){renderCalendar();$('#calendar-rows').querySelectorAll('.cal-row').forEach((r,i)=>{r.style.animationDelay=(.2+i*.2)+'s';r.classList.remove('play');void r.offsetWidth;r.classList.add('play')})}}
function resize(){document.documentElement.style.setProperty('--scale',Math.max(innerWidth/1920,innerHeight/1080))}addEventListener('resize',resize);resize();
async function load(){if(demo)return;try{const response=await fetch('./eventi.json?ts='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const obj=await response.json();if(Array.isArray(obj.events)&&Array.isArray(obj.standard))data=obj}catch(e){console.warn('Calendario non disponibile',e)}}
load().then(()=>{switchTo(0);setInterval(()=>{if(Date.now()-started>=slides[current].duration){started=Date.now();switchTo((current+1)%slides.length)}else if(current===1)renderProgram()},1000);setInterval(async()=>{await load();lastProgramKey='';if(current===1)renderProgram(true)},60000)});
})();
</script>
</body></html>
