
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rituali Benessere | Virgin Active Brescia</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #9e8d80;
}

#screen {
  position: absolute;
  width: 1600px;
  height: 900px;
  transform-origin: top left;
  overflow: hidden;
  color: white;
  background:
    radial-gradient(ellipse at 50% -25%,
      rgba(255,231,199,.55), transparent 65%),
    linear-gradient(125deg,
      #a89789 0%, #89796e 48%, #b5a599 100%);
}

/* Rivestimento SPA */
#screen::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(
      0deg, transparent 0 184px,
      rgba(65,47,37,.13) 185px,
      transparent 187px
    ),
    linear-gradient(90deg,
      transparent 49.9%,
      rgba(70,50,40,.07) 50%,
      transparent 50.1%);
  opacity: .5;
  pointer-events: none;
}

.glow {
  position: absolute;
  top: -300px;
  left: -80px;
  width: 1760px;
  height: 380px;
  border-radius: 50%;
  box-shadow: 0 0 85px 30px rgba(255,211,151,.55);
  border-bottom: 3px solid rgba(255,230,195,.8);
}

.layout {
  position: relative;
  display: grid;
  grid-template-columns: 710px 1fr;
  gap: 48px;
  height: 100%;
  padding: 45px 64px 45px 85px;
}

/* COLONNA SINISTRA */
.left {
  position: relative;
  padding-right: 46px;
  border-right: 3px solid rgba(255,255,255,.92);
  display: flex;
  flex-direction: column;
}

h1 {
  font-size: 68px;
  line-height: 1.055;
  font-weight: 800;
  letter-spacing: -1.5px;
  margin: 0 0 32px;
  text-shadow: 0 2px 2px rgba(0,0,0,.12);
}

.rule {
  height: 3px;
  width: 100%;
  background: rgba(255,255,255,.9);
  flex-shrink: 0;
}

h2 {
  font-size: 38px;
  line-height: 1.18;
  margin: 32px 0 24px;
  font-weight: 800;
}

.description {
  font-size: 27px;
  line-height: 1.28;
  font-weight: 700;
  margin: 0;
}

.welcome {
  font-size: 29px;
  font-weight: 700;
  margin-top: auto;
  margin-bottom: 30px;
}

.bottom-title {
  font-size: 30px;
  font-weight: 800;
  margin-top: 28px;
  white-space: nowrap;
}

/* CALENDARIO */
.calendar {
  align-self: center;
  background: rgba(48,48,48,.88);
  border: 2px solid #efddc6;
  border-radius: 42px;
  padding: 24px 30px;
  min-height: 744px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.event {
  display: grid;
  grid-template-columns: 148px 1fr;
  align-items: center;
  gap: 30px;
  min-height: 140px;
  border-bottom: 1px solid rgba(255,255,255,.18);
}

.event:last-child { border-bottom: 0; }

.date-badge {
  width: 148px;
  height: 106px;
  background: #f5e4d2;
  color: #1e130e;
  border-radius: 21px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.event:first-child .date-badge {
  background: #be0026;
  color: #fff;
  border: 2px solid #fff;
}

.day-number {
  font-size: 59px;
  line-height: .98;
  font-weight: 800;
}

.month {
  font-size: 25px;
  font-weight: 800;
}

.weekday {
  font-size: 43px;
  font-weight: 800;
  line-height: 1.1;
  white-space: nowrap;
}

.full-date {
  font-size: 27px;
  font-weight: 700;
  margin-top: 6px;
  white-space: nowrap;
}

.empty {
  text-align: center;
  font-size: 32px;
  font-weight: 700;
  padding: 40px;
}
</style>
</head>

<body>
<div id="screen">
  <div class="glow"></div>

  <main class="layout">
    <section class="left">
      <h1>
        ALZA LA<br>
        TEMPERATURA.<br>
        ABBASSA LO<br>
        STRESS.
      </h1>

      <div class="rule"></div>

      <h2>
        UN RITUALE DI<br>
        RIGENERAZIONE PROFONDA
      </h2>

      <p class="description">
        Scopri l’esperienza Aufguss, un viaggio tra
        vapore e aromi essenziali che rigenerano i
        sensi.
      </p>

      <p class="welcome">Ti aspettiamo.</p>
      <div class="rule"></div>
      <div class="bottom-title">PROSSIMI APPUNTAMENTI</div>
    </section>

    <section class="calendar" id="calendar"
      aria-label="Calendario prossimi rituali">
    </section>
  </main>
</div>

<script>
/* Date degli eventi: aggiungere qui le future date */
const events = [
  "2026-11-27",
  "2026-12-04",
  "2027-01-15",
  "2027-02-12",
  "2027-03-19"
];

const timezone = "Europe/Rome";

const monthsShort = [
  "GEN","FEB","MAR","APR","MAG","GIU",
  "LUG","AGO","SET","OTT","NOV","DIC"
];

const monthsLong = [
  "gennaio","febbraio","marzo","aprile",
  "maggio","giugno","luglio","agosto",
  "settembre","ottobre","novembre","dicembre"
];

const weekdays = [
  "DOMENICA","LUNEDÌ","MARTEDÌ","MERCOLEDÌ",
  "GIOVEDÌ","VENERDÌ","SABATO"
];

function italianToday() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: timezone,
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const get = type => parts.find(p => p.type === type).value;
  return `${get("year")}-${get("month")}-${get("day")}`;
}

function renderCalendar() {
  const today = italianToday();
  const upcoming = [...events]
    .filter(date => date >= today)
    .sort()
    .slice(0, 5);

  const container = document.getElementById("calendar");
  container.replaceChildren();

  if (upcoming.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "NUOVI APPUNTAMENTI IN ARRIVO";
    container.appendChild(empty);
    return;
  }

  for (const dateString of upcoming) {
    const [year, month, day] = dateString.split("-").map(Number);

    // UTC evita spostamenti di giorno dovuti al fuso.
    const weekdayIndex =
      new Date(Date.UTC(year, month - 1, day)).getUTCDay();

    const event = document.createElement("div");
    event.className = "event";

    const badge = document.createElement("div");
    badge.className = "date-badge";

    const dayNumber = document.createElement("div");
    dayNumber.className = "day-number";
    dayNumber.textContent = day;

    const monthLabel = document.createElement("div");
    monthLabel.className = "month";
    monthLabel.textContent = monthsShort[month - 1];

    badge.append(dayNumber, monthLabel);

    const info = document.createElement("div");

    const weekday = document.createElement("div");
    weekday.className = "weekday";
    weekday.textContent = weekdays[weekdayIndex];

    const fullDate = document.createElement("div");
    fullDate.className = "full-date";
    fullDate.textContent =
      `${day} ${monthsLong[month - 1]} ${year}`;

    info.append(weekday, fullDate);
    event.append(badge, info);
    container.appendChild(event);
  }
}

/* Adattamento automatico a qualsiasi risoluzione 16:9 */
function resizeScreen() {
  const scale = Math.min(
    window.innerWidth / 1600,
    window.innerHeight / 900
  );

  const screen = document.getElementById("screen");
  screen.style.transform = `scale(${scale})`;
  screen.style.left = `${(window.innerWidth - 1600 * scale) / 2}px`;
  screen.style.top = `${(window.innerHeight - 900 * scale) / 2}px`;
}

window.addEventListener("resize", resizeScreen);

resizeScreen();
renderCalendar();

// Aggiornamento anche senza ricaricare la pagina.
setInterval(renderCalendar, 60000);
</script>
</body>
</html>
